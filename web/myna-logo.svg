<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="120" height="120">
  <defs>
    <!-- Define animations as reusable entities -->
    <style>
      /* Keyframes for soft ambient glow pulse */
      @keyframes pulseGlow {
        0% { stop-opacity: 0.8; }
        50% { stop-opacity: 0.5; }
        100% { stop-opacity: 0.8; }
      }

      /* Keyframes for the 'speaking' audio waves */
      @keyframes waveActive {
        0% { transform: scaleX(0.8) translateX(2px); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: scaleX(1.2) translateX(-2px); opacity: 0; }
      }

      /* Target the glow stops */
      #mynaGlow stop:nth-child(1) {
        animation: pulseGlow 3s ease-in-out infinite;
      }
      
      #mynaGlow stop:nth-child(2) {
        animation: pulseGlow 3s ease-in-out infinite 0.5s; /* Offset for smoothness */
      }

      /* Target the audio waves and animate them based on group */
      .audio-wave {
        transform-origin: center right; /* Scale from the right side */
      }

      .wave-1 {
        animation: waveActive 1.2s ease-out infinite;
      }

      .wave-2 {
        animation: waveActive 1.2s ease-out infinite 0.4s; /* Offset for sequence */
      }
    </style>

    <!-- Outer Glow Effect -->
    <radialGradient id="mynaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFA500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Soft Head Gradient -->
    <linearGradient id="mynaHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D282A"/>
      <stop offset="100%" stop-color="#1A1718"/>
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="mynaBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="80" cy="80" r="70" fill="url(#mynaGlow)" />

  <!-- Feather Crown / Crest -->
  <path d="M 72 22 Q 70 10 77 14 Q 80 20 80 25 Q 85 10 88 16 Q 88 22 84 26" fill="#2D282A" />

  <!-- Main Head Base -->
  <circle cx="80" cy="82" r="48" fill="url(#mynaHead)" />

  <!-- Signature Myna Yellow Eye Patches (Bilateral) -->
  <ellipse cx="60" cy="78" rx="18" ry="16" fill="#FFC700" />
  <ellipse cx="100" cy="78" rx="18" ry="16" fill="#FFC700" />

  <!-- Expressive Big Eyes -->
  <circle cx="62" cy="78" r="12" fill="#FFFFFF" />
  <circle cx="98" cy="78" r="12" fill="#FFFFFF" />
  
  <!-- Pupils -->
  <circle cx="64" cy="79" r="7" fill="#1A1718" />
  <circle cx="96" cy="79" r="7" fill="#1A1718" />

  <!-- Eye Highlights -->
  <circle cx="61" cy="76" r="3" fill="#FFFFFF" />
  <circle cx="66" cy="81" r="1.5" fill="#FFFFFF" />
  <circle cx="93" cy="76" r="3" fill="#FFFFFF" />
  <circle cx="98" cy="81" r="1.5" fill="#FFFFFF" />

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="44" cy="92" rx="7" ry="4" fill="#FF6B6B" opacity="0.4" />
  <ellipse cx="116" cy="92" rx="7" ry="4" fill="#FF6B6B" opacity="0.4" />

  <!-- Bright Yellow/Orange Beak -->
  <path d="M 70 85 Q 80 82 90 85 Q 80 112 70 85 Z" fill="url(#mynaBeak)" stroke="#E67E00" stroke-width="1" />
  <!-- Beak Center Line -->
  <path d="M 70 86 Q 80 89 90 86" fill="none" stroke="#D35400" stroke-width="1.5" stroke-linecap="round" />

  <!-- Audio Waves (Optional Accent matching reference UI) - ANIMATED VERSION -->
  <g class="audio-wave wave-1">
    <path d="M 132 72 A 12 12 0 0 1 132 92" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="audio-wave wave-2">
    <path d="M 139 66 A 20 20 0 0 1 139 98" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
